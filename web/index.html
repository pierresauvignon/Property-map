  margin-top:var(--s0); padding:var(--s-1) var(--s0); border-radius:4px;
  background:oklch(1 0 0 / .06); font-size:0.8125rem; line-height:1.45;
  color:oklch(0.82 0.008 var(--h));
}
.slide__note b{color:var(--who); font-size:0.6875rem; display:block; margin-bottom:2px}
.slide__acts{display:flex; gap:var(--s-1); margin-top:var(--s1); flex-wrap:wrap}
.slide__acts button, .slide__acts a{
  padding:8px var(--s0); border-radius:99px; cursor:pointer; text-decoration:none;
  background:oklch(1 0 0 / .08); border:1px solid oklch(1 0 0 / .16);
  color:oklch(0.9 0.008 var(--h)); font-size:0.75rem; font-weight:500;
}
.slide__acts button:hover, .slide__acts a:hover{background:oklch(1 0 0 / .15)}

/* chrome */
.deck__x, .deck__arrow{
  position:absolute; z-index:10; cursor:pointer; display:grid; place-items:center;
  background:oklch(0 0 0 / .5); border:1px solid oklch(1 0 0 / .2);
  color:oklch(0.97 0.005 var(--h)); border-radius:50%;
  transition:background .16s;
}
.deck__x:hover, .deck__arrow:hover{background:oklch(0 0 0 / .8)}
.deck__x{top:var(--s1); left:var(--s1); width:36px; height:36px; font-size:0.875rem}
.deck__arrow{top:50%; transform:translateY(-50%); width:44px; height:44px; font-size:1.375rem}
.deck__arrow--prev{left:var(--s1)}
.deck__arrow--next{right:var(--s1)}
@media (max-width:700px){
  .deck__arrow{display:none}
  .slide__body{padding:0 var(--s1)}
}

/* Wide screens: stop stranding a phone-shaped column in the middle of a
   desktop. The photograph takes the left half at full height, the facts and
   the rating sit in a fixed column on the right, always in view. */
@media (min-width:900px){
  .slide{align-items:stretch; justify-content:center; overflow:hidden}
  /* No width cap: on a large screen the point is to see the house, so the
     photograph takes everything the facts column does not need. */
  .slide__inner{
    max-width:none; width:100%; height:100%; padding:0;
    display:grid; grid-template-columns:minmax(0,1fr) clamp(380px, 26vw, 460px);
  }
  .slide__shot{
    aspect-ratio:auto; height:100%; min-height:0;
    display:grid; grid-template-rows:minmax(0,1fr) auto;
    background:oklch(0.09 0.006 var(--h));
  }
  .slide__gal{grid-row:1}
  /* contain, not cover: a full-height pane crops the top and bottom off a
     landscape photo, which is exactly the part of a house you want to see */
  .slide__gal figure img{object-fit:contain}
  .slide__grad{display:none}
  .slide__segs{display:none}
  .slide__count{right:auto; left:16px; top:16px}
  .deck__x{left:auto; right:var(--s1)}
  .slide__body{
    margin-top:0; padding:var(--s3) var(--s2) var(--s4);
    overflow-y:auto; overscroll-behavior:contain;
    border-left:1px solid oklch(1 0 0 / .08);
  }
  .slide__name{font-size:2rem}
  .slide__price{font-size:2rem}
  .slide__map{height:220px}

  /* a filmstrip, so the whole set is visible at once rather than one at a time */
  .slide__thumbs{
    grid-row:2; display:flex; gap:6px; padding:10px 12px;
    overflow-x:auto; scrollbar-width:none;
    background:oklch(0.11 0.006 var(--h)); border-top:1px solid oklch(1 0 0 / .08);
  }
  .slide__thumbs::-webkit-scrollbar{display:none}
  .slide__thumbs button{
    flex:0 0 auto; width:84px; height:58px; padding:0; cursor:pointer;
    border:2px solid transparent; border-radius:4px; overflow:hidden;
    background:oklch(0.2 0.01 var(--h)); opacity:.5;
    transition:opacity .16s, border-color .16s;
  }
  .slide__thumbs button img{width:100%; height:100%; object-fit:cover; display:block}
  .slide__thumbs button:hover{opacity:.85}
  .slide__thumbs button.on{opacity:1; border-color:var(--accent)}
}
@media (max-width:899px){ .slide__thumbs{display:none} }

/* ─────────────── connectivity ─────────────── */
.wire{
  position:fixed; z-index:4000; left:50%; bottom:var(--s1); transform:translateX(-50%);
  display:flex; align-items:center; gap:var(--s-1); padding:7px var(--s0);
  background:var(--ink); color:var(--paper); border-radius:99px; box-shadow:var(--shadow-2);
  font-size:0.6875rem; font-weight:500;
}
.wire[hidden]{display:none}
.wire i{width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none}

/* ─────────────── phone ─────────────── */
@media (max-width:860px){
  .app{display:block; height:100dvh}
  .rail, .map-wrap{grid-area:auto}
  .map-wrap{position:fixed; inset:0}
  /* Legend keeps the top-left; Leaflet's zoom buttons move to the top-right
     so the two no longer stack on each other. Pinch still zooms. */
  .key{bottom:auto; top:var(--s1); left:var(--s1); padding:var(--s-1) var(--s0)}
  .key h2, .key__ends, .key__none{display:none}
  .leaflet-top.leaflet-left{left:auto; right:0}
  .leaflet-top.leaflet-left .leaflet-control{margin:var(--s1) var(--s1) 0 0}
  .leaflet-bar a{width:40px !important; height:40px !important; line-height:40px !important; font-size:20px !important}
  /* The drawer sits ABOVE the detail panel so its handle stays tappable even
     when the panel is full-screen, and it can collapse to just that handle. */
  .rail{
    position:fixed; left:0; right:0; bottom:0; z-index:1300; height:88dvh;
    border-right:none; border-top:1px solid var(--rule); border-radius:14px 14px 0 0;
    box-shadow:var(--shadow-2); transform:translateY(var(--sheet, 60dvh));
    transition:transform .34s cubic-bezier(.16,.84,.30,1); touch-action:none;
  }
  .rail.dragging{transition:none}
  .grip{
    display:block; width:100%; padding:14px 0 10px; background:none; border:none;
    cursor:grab; touch-action:none; position:relative;
  }
  .grip::before{content:""; display:block; width:42px; height:5px; margin:0 auto; border-radius:99px; background:var(--rule)}
  /* Leaflet's own controls sit at z-index 1000, which put the +/- buttons on
     top of the detail panel. Panel goes above them; the map is behind it anyway. */
  .sheet{z-index:1200}
  /* clear the collapsed drawer handle so the last field is reachable */
  .sheet__body{padding-bottom:84px}
  .list{padding-bottom:24px}
  /* The toolbar was pinned to the top-right corner and ran over the stats
     line. On a phone it becomes its own row under the standfirst: browse and
     add on the left, identity and theme on the right, all 40px tall. */
  .masthead{padding:0 var(--s1) var(--s-1)}
  h1{font-size:1.375rem}
  .standfirst{max-width:none}
  .mast__tools{margin-top:5px}
  .icon-btn{width:38px; height:38px; font-size:1rem}
  .browse-btn{padding:0 18px; min-height:40px}
  .me{min-height:40px; padding:0 14px}
  .controls{padding:0 var(--s1) var(--s-1)}
  /* same row, a little tighter: the photo gives up what the figures need */
  .card{grid-template-columns:104px minmax(0, 1fr); gap:var(--s-1)}
  .price{font-size:1.0625rem}
  .sheet{width:100%; border-left:none}
  .rail-toggle{display:none}
  /* While placing a point the panel must get out of the way, or there is no
     map to click — it covers the whole screen at this width. It slides down
     to a grab strip and comes back with the coordinates filled in. */
  .placing .sheet.open{transform:translateY(calc(100% - 52px))}
  .placing .sheet .sheet__scroll{overflow:hidden}
  .placing .sheet__close{display:none}
  .placing .sheet.open::before{
    content:"Formulaire — clique sur la carte pour placer le point";
    position:absolute; left:0; right:0; top:0; height:52px;
    display:flex; align-items:center; justify-content:center;
    font-size:0.6875rem; font-weight:500; color:var(--ink-3);
    background:var(--surface); border-top:1px solid var(--rule);
    border-radius:14px 14px 0 0; z-index:3; padding:0 var(--s1); text-align:center;
  }
  .seg button, .chips button, .btn{min-height:36px}
  /* the bottom drawer covers the last rows, so the table scrolls past it */
  .tablewrap__scroll{padding-bottom:34dvh}
  /* the toggle takes the top-right corner, so the zoom buttons drop below it */
  .viewtog{top:var(--s-1); right:var(--s-1)}
  .leaflet-top.leaflet-left .leaflet-control{margin:58px var(--s1) 0 0}
  .map-wrap:has(.sheet.open) .viewtog{display:none}
}
@media (max-width:860px) and (prefers-reduced-motion:reduce){ .rail{transition:none} }
</style>
</head>
<body>

<!-- login -->
<section class="gate" id="gate" hidden>
  <div class="gate__card">
    <h1>Les biens</h1>
    <p>Notre carte partagée des maisons et terrains.</p>
    <div class="who" id="who">
      <button type="button" data-user="alex" aria-pressed="false" style="--who:var(--alex)">
        <b>Alex</b><span>se connecter</span>
      </button>
      <button type="button" data-user="sam" aria-pressed="false" style="--who:var(--sam)">
        <b>Sam</b><span>se connecter</span>
      </button>
      <button type="button" data-user="guest" aria-pressed="false" style="--who:var(--guest)">
        <b>Invité</b><span>se connecter</span>
      </button>
    </div>
    <form id="gateForm">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="gate__go" id="gateGo" type="submit" disabled>Entrer</button>
      <p class="gate__err" id="gateErr" role="alert"></p>
    </form>
  </div>
</section>

<!-- app -->
<div class="app" id="app" hidden>
  <aside class="rail" id="rail">
    <button class="grip" id="grip" aria-label="Déplier ou replier la liste"></button>

    <header class="masthead">
      <div class="mast__row">
        <div class="mast__id">
          <h1>Les biens</h1>
          <p class="standfirst" id="standfirst"></p>
        </div>
        <div class="mast__tools">
          <button class="browse-btn" id="browse" title="Parcourir les biens un par un">Parcourir</button>
          <button class="icon-btn" id="addPoi" aria-label="Ajouter un repère" title="Ajouter un repère (école, commerces…)">◎</button>
          <button class="icon-btn" id="add" aria-label="Ajouter un bien" title="Ajouter un bien">+</button>
          <button class="me" id="me" title="Changer d'utilisateur"></button>
          <button class="icon-btn" id="theme" aria-label="Basculer clair et sombre">◑</button>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="selects">
        <label class="sel">
          <span>Type</span>
          <select id="kind">
            <option value="all">Tout</option>
            <option value="property">Maisons</option>
            <option value="land">Terrains</option>
          </select>
        </label>
        <label class="sel">
          <span>Sélection</span>
          <select id="view">
            <option value="all">Tous</option>
            <option value="mine">Ma liste</option>
            <option value="theirs">Sa liste</option>
            <option value="both">Commune</option>
            <option value="hidden">Masqués</option>
          </select>
        </label>
        <label class="sel">
          <span>Commune</span>
          <select id="town"></select>
        </label>
      </div>

      <details class="more" id="more">
        <summary>Plus de filtres</summary>
        <div class="more__body">
          <div class="field">
            <label class="lab" for="q">Recherche</label>
            <input class="search" id="q" type="search" placeholder="rue, note…" autocomplete="off">
          </div>
          <div class="field">
            <label class="lab" for="maxPrice">Budget maximum <b id="maxPriceOut"></b></label>
            <div class="hist" id="hist" aria-hidden="true"></div>
            <input id="maxPrice" type="range" min="0" max="100" value="100">
          </div>
          <div class="field">
            <label class="lab" for="minSurface">Surface minimum <b id="minSurfaceOut"></b></label>
            <input id="minSurface" type="range" min="0" max="100" value="0">
          </div>
          <div class="field">
            <span class="lab" id="sortLab">Trier</span>
            <nav class="sorts" id="sorts" aria-labelledby="sortLab">
              <button data-sort="score" aria-pressed="true">Note</button>
              <button data-sort="total" aria-pressed="false">Total</button>
              <button data-sort="price" aria-pressed="false">Prix</button>
              <button data-sort="surface" aria-pressed="false">Surface</button>
              <button data-sort="ppm" aria-pressed="false">€ / m²</button>
              <button data-sort="name" aria-pressed="false">Adresse</button>
            </nav>
          </div>
        </div>
      </details>
    </div>

    <ol class="list" id="list"></ol>
  </aside>

  <main class="map-wrap">
    <div id="map"></div>
    <section class="tablewrap" id="tablewrap" hidden aria-label="Tableau des biens"></section>
    <section class="dashwrap" id="dashwrap" hidden aria-label="Tableau de bord"></section>
    <nav class="viewtog" id="viewtog" aria-label="Vue">
      <button type="button" data-v="dash" aria-pressed="false">Dash</button>
      <button type="button" data-v="map" aria-pressed="true">Carte</button>
      <button type="button" data-v="table" aria-pressed="false">Tableau</button>
    </nav>
    <button class="rail-toggle" id="railToggle" aria-expanded="true"
            aria-controls="rail" title="Replier le panneau (touche \\)">‹</button>
    <section class="key" id="key" aria-label="Échelle des couleurs"></section>
    <div class="hint" id="hint" hidden>
      <span id="hintTxt"></span><button type="button" id="hintCancel">annuler</button>
    </div>
    <aside class="sheet" id="sheet" aria-live="polite"></aside>
  </main>
</div>

<section class="poidlg" id="poidlg" hidden aria-label="Nouveau repère">
  <form class="poidlg__card" id="poiForm">
    <h2 id="poiTitle">Nouveau repère</h2>
    <label for="poiName">Nom</label>
    <input id="poiName" maxlength="80" placeholder="École, boulangerie, bureau…" autocomplete="off">
    <span class="poidlg__lab">Icône</span>
    <div class="poidlg__icons" id="poiIcons"></div>
    <div class="poidlg__acts">
      <button class="btn btn--go" type="submit">Enregistrer</button>
      <button class="btn" type="button" id="poiCancel">Annuler</button>
      <button class="btn btn--warn" type="button" id="poiDelete" hidden>Supprimer</button>
    </div>
  </form>
</section>

<section class="deck" id="deck" hidden aria-label="Parcourir les biens">
  <div class="deck__stage" id="deckStage"></div>
  <button class="deck__x" id="deckX" aria-label="Fermer">✕</button>
  <button class="deck__arrow deck__arrow--prev" id="deckPrev" aria-label="Bien précédent">‹</button>
  <button class="deck__arrow deck__arrow--next" id="deckNext" aria-label="Bien suivant">›</button>
</section>

<section class="lightbox" id="lightbox" hidden aria-label="Photo en plein écran">
  <div class="lightbox__strip" id="lbStrip"></div>
  <div class="lightbox__bar">
    <span id="lbCaption"></span>
    <b id="lbCount"></b>
    <button class="lightbox__del" id="lbDel" aria-label="Supprimer cette photo" title="Supprimer cette photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
    </button>
    <button class="lightbox__x" id="lbX" aria-label="Fermer">✕</button>
  </div>
</section>

<div class="wire" id="wire" hidden><i></i><span id="wireTxt"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
